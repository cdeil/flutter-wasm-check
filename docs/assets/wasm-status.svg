eight="400">Non-isolated Firefox engine</text><text x="364" y="892" font-size="17" fill="#24334b" font-weight="400">lane exercises the two</text><text x="364" y="920" font-size="17" fill="#24334b" font-weight="400">worker-mode test skips.</text><rect x="362" y="953" width="250" height="28" rx="14" fill="#e5f5ed" stroke="none"/><text x="374" y="973" font-size="16" fill="#16724b" font-weight="700">54 passed · 0 skipped</text><path d="M 633 876 H 645 M 640 871 L 645 876 L 640 881" fill="none" stroke="#8aa1c0" stroke-width="2"/><rect x="652" y="746" width="282" height="249" rx="14" fill="#ffffff" stroke="#ccd8e7"/><circle cx="680" cy="778" r="15" fill="#e6edf8"/><text x="675" y="784" font-size="17" fill="#2059a5" font-weight="700">3</text><text x="670" y="823" font-size="21" fill="#12233e" font-weight="700">Review the evidence</text><text x="670" y="864" font-size="17" fill="#24334b" font-weight="400">Mozilla: release + Nightly.</text><text x="670" y="892" font-size="17" fill="#24334b" font-weight="400">Flutter: candidate A/B and</text><text x="670" y="920" font-size="17" fill="#24334b" font-weight="400">reduced transition cases.</text><rect x="668" y="953" width="250" height="28" rx="14" fill="#e8f0ff" stroke="none"/><text x="680" y="973" font-size="16" fill="#2059a5" font-weight="700">Drafts + test patch ready</text><path d="M 939 876 H 951 M 946 871 L 951 876 L 946 881" fill="none" stroke="#8aa1c0" stroke-width="2"/><rect x="958" y="746" width="282" height="249" rx="14" fill="#ffffff" stroke="#ccd8e7"/><circle cx="986" cy="778" r="15" fill="#e6edf8"/><text x="981" y="784" font-size="17" fill="#2059a5" font-weight="700">4</text><text x="976" y="823" font-size="19" fill="#12233e" font-weight="700">Contribute, then recheck</text><text x="976" y="864" font-size="17" fill="#24334b" font-weight="400">Human review → focused</text><text x="976" y="892" font-size="17" fill="#24334b" font-weight="400">comment/patch → released</text><text x="976" y="920" font-size="17" fill="#24334b" font-weight="400">fixes → rollout checks.</text><rect x="974" y="953" width="250" height="28" rx="14" fill="#fff0dc" stroke="none"/><text x="986" y="973" font-size="16" fill="#985413" font-weight="700">Next: nothing posted</text><text x="40" y="1033" font-size="17" fill="#52647d" font-weight="400">Rates are Flutter frame starts, not displayed FPS. Hybrid gains cover two vendor Firefox worker cases.</text><text x="40" y="1061" font-size="17" fill="#52647d" font-weight="400">Desktop fixtures only; physical mobile, cold startup and every-refresh presentation remain unqualified.</text><text x="40" y="1095" font-size="16" fill="#52647d" font-weight="400">Full evidence, raw data and unposted drafts: github.com/cdeil/flutter-wasm-check</text></g></svg>
