name: flutter_wasm_check
description: Synthetic interactive grids, charts and platform views for Flutter web compiler and renderer checks.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.7
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  fl_chart: 1.3.0
  graphic: 2.7.0
  syncfusion_flutter_charts: 35.1.43
  syncfusion_flutter_datagrid: 35.1.43
  trina_grid: 2.4.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/Roboto-Regular.ttf
